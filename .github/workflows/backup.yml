name: Backup diario

# Base dos veces al día: GitHub atrasa los cron entre 6 y 10 h y una sola dejó pasar 27 h (RNF-09 pide 24 h máx.). Fotos (completa) una vez por semana, los domingos, guardadas 14 días; la de base se guarda 30.
# Motivo: el cupo de minutos de Actions de la cuenta Free (completa 5-13 min, base 4) además del de 500 MB de almacenamiento.
on:
  schedule:
    - cron: "23 5 * * 0" # completa (domingo)
    - cron: "23 5 * * 1-6" # base
    - cron: "23 17 * * *" # base
  workflow_dispatch:
    inputs:
      tipo:
        description: "completo = base y fotos; base = solo la base de datos"
        type: choice
        options: [completo, base]
        default: completo

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exigir el secreto SUPABASE_DB_URL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Falta el secreto SUPABASE_DB_URL (cadena de conexión de Supabase, ver docs/stack.md)"; exit 1; }

      - name: Calcular el tipo de corrida
        id: tipo
        env:
          EVENTO: ${{ github.event_name }}
          ENTRADA: ${{ inputs.tipo }}
          CRON: ${{ github.event.schedule }}
        run: |
          tipo=base
          if [ "$EVENTO" = workflow_dispatch ] && [ "$ENTRADA" = completo ]; then tipo=completo; fi
          if [ "$CRON" = "23 5 * * 0" ]; then tipo=completo; fi
          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Solo hace falta para el CLI de Supabase (pnpm exec supabase).
      - name: Instalar dependencias
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Respaldar (roles, esquema y datos)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/backup/respaldar.sh "$SUPABASE_DB_URL" "$RUNNER_TEMP/dump"

      # Sin SUPABASE_URL o SUPABASE_SERVICE_ROLE_KEY el backup de la base sigue y las fotos se omiten con un aviso.
      - name: Respaldar fotos (bucket productos)
        if: steps.tipo.outputs.tipo == 'completo'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Fotos NO respaldadas: faltan los secretos SUPABASE_URL y/o SUPABASE_SERVICE_ROLE_KEY (docs/backup.md, Requisitos)"
            exit 0
          fi
          scripts/backup/respaldar-fotos.sh "$RUNNER_TEMP/dump"

      - name: Restaurar en una base efímera y verificar
        run: |
          destino=$(scripts/backup/destino-efimero.sh "$RUNNER_TEMP/destino" erp-restauracion 54521)
          scripts/backup/restaurar.sh "$RUNNER_TEMP/dump" "$destino"
          scripts/backup/verificar.sh "$RUNNER_TEMP/dump" "$destino"

      - name: Verificar fotos
        if: steps.tipo.outputs.tipo == 'completo'
        run: scripts/backup/verificar-fotos.sh "$RUNNER_TEMP/dump"

      - name: Cifrar con age
        id: cifrar
        env:
          TIPO: ${{ steps.tipo.outputs.tipo }}
        run: |
          nombre="erp-backup-$(date -u +%Y-%m-%dT%H%MZ)-$TIPO.tar.age"
          mkdir "$RUNNER_TEMP/salida"
          tar -C "$RUNNER_TEMP/dump" -cf - . | age -R scripts/backup/destinatario-age.txt -o "$RUNNER_TEMP/salida/$nombre"
          echo "nombre=${nombre%.tar.age}" >> "$GITHUB_OUTPUT"

      # Solo el .age: el dump en claro nunca sale del runner.
      - name: Subir el backup cifrado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cifrar.outputs.nombre }}
          path: ${{ runner.temp }}/salida/*.age
          if-no-files-found: error
          retention-days: ${{ steps.tipo.outputs.tipo == 'completo' && 14 || 30 }}
