name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  GITLEAKS_VERSION: 8.24.3
  GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

jobs:
  # scripts/importacion/ es un paquete aparte (usa service_role, no entra en web/). Aquí solo tipos y pruebas unitarias:
  # la importación real no corre en CI.
  importacion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/importacion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: scripts/importacion/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: scripts/importacion/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: tsc y Vitest
        run: |
          pnpm typecheck
          pnpm test

  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks recorre el historial
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 1. Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: 2. ESLint, Prettier y tsc
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck

      - name: 3. gitleaks
        working-directory: .
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
          rm gitleaks gitleaks.tar.gz

      - name: 4. Vitest
        run: pnpm test

      - name: 5. Supabase, migraciones desde cero y pgTAP
        run: |
          pnpm db:start -x studio,imgproxy,mailpit
          pnpm db:reset
          pnpm db:test

      - name: 5b. Variables de Supabase local para build y E2E
        run: |
          salida=$(pnpm exec supabase status -o env --workdir .. 2>/dev/null | grep -E '^(API_URL|ANON_KEY)=')
          eval "$salida"
          echo "::add-mask::$ANON_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: 6. Tipos generados sin diferencias
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: 7. next build
        run: pnpm build

      - name: 7b. Edge Function admin-usuarios e integración
        run: |
          nohup pnpm exec supabase functions serve --workdir .. > "$RUNNER_TEMP/functions.log" 2>&1 &
          # `supabase start` ya dejó un runtime que responde 401; `functions serve` lo recrea (502 en medio).
          # Esperar su línea de "listo" antes de sondear, o el 401 del contenedor viejo cuenta como éxito.
          for i in $(seq 1 60); do grep -q 'Serving functions on' "$RUNNER_TEMP/functions.log" && break; sleep 2; done
          # verify_jwt rechaza sin token con 401: basta para saber que el runtime ya sirve la función.
          for i in $(seq 1 60); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/admin-usuarios" || true)
            [ "$codigo" = "401" ] && break
            sleep 2
          done
          [ "$codigo" = "401" ] || { cat "$RUNNER_TEMP/functions.log"; exit 1; }
          pnpm test:integracion

      - name: 8. Playwright
        run: |
          pnpm db:reset
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      # Último a propósito: el test crea sus propios negocios y no debe tocar el estado de Playwright.
      - name: 9. Importación, integración contra Supabase local
        run: |
          salida=$(pnpm exec supabase status -o env --workdir .. 2>/dev/null | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')
          eval "$salida"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          export SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          cd ../scripts/importacion
          pnpm install --frozen-lockfile
          pnpm test:integracion

      - name: Log de functions serve
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log" || true

      - name: Subir reporte y trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
