name: Auditoría de dependencias

on:
  pull_request:
    paths: ["**/pnpm-lock.yaml", "**/package.json", ".github/workflows/audit.yml"]
  schedule:
    - cron: "0 12 * * 1" # lunes 08:00 en La Paz (UTC-4)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        paquete: [web, scripts/importacion]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.paquete }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      # Falla con cualquier vulnerabilidad alta o crítica: el lunes aparece en rojo en Actions.
      - name: pnpm audit
        run: pnpm audit --audit-level=high
